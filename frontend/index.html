<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiSync</title>
    <style>
      :root {
        --boot-bg: #ffffff;
        --boot-text: #37352f;
        --boot-muted: #787774;
        --boot-accent: #2eaadc;
        --boot-border: #e9e9e7;
      }

      body {
        margin: 0;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      .boot-card {
        width: min(320px, calc(100vw - 48px));
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .boot-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid var(--boot-border);
        border-radius: 8px;
        color: var(--boot-accent);
        font-weight: 700;
      }

      .boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid color-mix(in srgb, var(--boot-accent) 18%, transparent);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      .boot-text {
        margin: 0;
        color: var(--boot-muted);
        font-size: 13px;
        text-align: center;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" class="boot-screen">
        <div class="boot-card">
          <div class="boot-mark">A</div>
          <div class="boot-spinner" aria-hidden="true"></div>
          <h1 class="boot-title">AiSync 正在启动</h1>
          <p class="boot-text">正在加载前端资源</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function escapeHtml(value) {
          return String(value).replace(/[&<>"']/g, function (char) {
            return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char];
          });
        }
        function showBootError(message) {
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<div style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;padding:24px;color:#37352f;white-space:pre-wrap;">' +
            '<h1 style="margin:0 0 8px;font-size:18px;color:#e03e3e;">AiSync frontend failed to start</h1>' +
            "<div>" + escapeHtml(message) + "</div></div>";
        }
        window.addEventListener("error", function (event) {
          showBootError(event.message || event.error || "Unknown script error");
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          showBootError(reason && reason.stack ? reason.stack : reason || "Unknown async error");
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
