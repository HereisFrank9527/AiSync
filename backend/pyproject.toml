[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisync-backend"
version = "0.1.0"
description = "AiSync Python backend for AI-assisted novel writing"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "fastapi>=0.115.0",
    "openai>=1.70.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
vector = ["chromadb>=0.6.0"]
package = ["pyinstaller>=6.11.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[project.scripts]
aisync-backend = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
