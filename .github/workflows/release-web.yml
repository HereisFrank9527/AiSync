name: Release Web Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend test dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Check release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            ./scripts/check_release.ps1 -ExpectedVersion $env:GITHUB_REF_NAME
          } else {
            ./scripts/check_release.ps1
          }

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Build Web release package
        run: npm run release:web

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisync-web-${{ github.ref_name }}
          path: |
            .release/*.zip
            .release/*.sha256
          if-no-files-found: error
          include-hidden-files: true

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -LiteralPath .release -File | Where-Object {
            $_.Name -like "*.zip" -or $_.Name -like "*.sha256"
          } | Select-Object -ExpandProperty FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --generate-notes --title "AiSync $tag"
          }
